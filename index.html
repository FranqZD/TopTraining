<!doctype html>
<html lang="es" data-theme="ember">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0A0A0B" />
    <meta name="description" content="Top Training — entrena con tus amigos. O aguántate la vergüenza." />
    <link rel="icon" type="image/svg+xml" href="/icon-app-black.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS ignora el manifest para el ícono de la pantalla de inicio. -->
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Top Training" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&display=swap"
      rel="stylesheet"
    />
    <title>Top Training</title>
    <script>
      /* PWA a escala fija: sin pellizco, sin doble toque, sin Ctrl/⌘ + rueda. */
      (function () {
        const stop = (event) => event.preventDefault()
        document.addEventListener('gesturestart', stop)
        document.addEventListener('gesturechange', stop)
        document.addEventListener('gestureend', stop)
        document.addEventListener(
          'touchmove',
          (event) => {
            if (event.touches.length > 1) event.preventDefault()
          },
          { passive: false },
        )
        document.addEventListener(
          'wheel',
          (event) => {
            if (event.ctrlKey) event.preventDefault()
          },
          { passive: false },
        )
        document.addEventListener('dragstart', stop)
        document.addEventListener('keydown', (event) => {
          if (
            (event.ctrlKey || event.metaKey) &&
            (event.key === '+' || event.key === '-' || event.key === '=' || event.key === '_' || event.key === '0')
          ) {
            event.preventDefault()
          }
        })
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
